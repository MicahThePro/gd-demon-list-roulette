name: Deploy to GitHub Pages

# Any push to main publishes. workflow_dispatch lets you re-publish by hand
# without making an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these to serve the site: it writes a deploy token into the
# GITHUB_TOKEN scope and points the Pages environment at the built artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A newer push cancels an in-flight older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gd-list-roulette/package-lock.json

      - name: Install
        working-directory: gd-list-roulette
        run: npm ci

      - name: Build
        working-directory: gd-list-roulette
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gd-list-roulette/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
